<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dada Best | Admin</title>
<style>
:root{--blue:#1264ff;--blue2:#063b9f;--cyan:#35c8ff;--dark:#07152f;--bg:#f4f8ff;--card:#fff;--line:#e1eaf6;--muted:#64748b;--green:#12a66f;--red:#e5484d}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#35c8ff55,transparent 30%),linear-gradient(135deg,#063b9f,#07152f)}
.login-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 30px 80px #0004}.brand{font-size:30px;font-weight:950;color:var(--blue);margin-bottom:6px}.brand span{color:var(--dark)}
.login-card p{color:var(--muted)}label{display:block;font-weight:900;margin:14px 0 7px}
input,textarea,select{width:100%;padding:13px;border:1px solid #cbd8e9;border-radius:11px;background:#fff;outline:0}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1264ff15}
.primary{background:linear-gradient(100deg,var(--blue2),var(--blue));color:#fff;padding:13px 18px;border-radius:11px;font-weight:900}.soft{background:#eaf2ff;color:var(--blue);padding:11px 15px;border-radius:11px;font-weight:900}.danger{background:#fee2e2;color:#b42318;padding:11px 15px;border-radius:11px;font-weight:900}.success{background:#dcfce7;color:#087443}
.app{display:none;min-height:100vh}.sidebar{position:fixed;right:0;top:0;bottom:0;width:250px;background:#fff;border-left:1px solid var(--line);padding:24px 15px;z-index:20}.logo{font-size:27px;font-weight:950;color:var(--blue);padding:5px 10px 25px}.logo span{color:var(--dark)}
.navbtn{width:100%;background:none;text-align:right;padding:13px 14px;border-radius:11px;margin:3px 0;color:#475569;font-weight:900}.navbtn.active,.navbtn:hover{background:#edf4ff;color:var(--blue)}
.main{margin-right:250px;padding:25px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.topbar h1{margin:0;font-size:32px}.status{background:#dcfce7;color:#087443;padding:9px 13px;border-radius:50px;font-size:13px;font-weight:900}
.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 30px #0b245008}.stat small{color:var(--muted);font-weight:800}.stat b{display:block;font-size:30px;margin-top:8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:20px;box-shadow:0 10px 30px #0b245008}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panel-head h2{margin:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{max-width:320px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.product{border:1px solid var(--line);border-radius:18px;padding:12px;position:relative}.pic{height:190px;border-radius:14px;background:linear-gradient(145deg,#eaf3ff,#f8fbff);display:grid;place-items:center;font-size:55px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.product h3{margin:13px 5px 5px}.price{font-size:22px;font-weight:950;margin:8px 5px}.meta{color:var(--muted);font-size:13px;margin:5px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1}
.badge{position:absolute;top:20px;right:20px;background:#dcfce7;color:#087443;border-radius:50px;padding:5px 9px;font-size:11px;font-weight:900}.badge.off{background:#fee2e2;color:#a21c24}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.upload{border:2px dashed #b8cbea;border-radius:16px;padding:18px;text-align:center;background:#f8fbff}.preview{width:210px;height:160px;margin:15px auto;border-radius:14px;background:#edf4ff;display:grid;place-items:center;font-size:50px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}
.modal-bg{display:none;position:fixed;inset:0;background:#07152f99;z-index:100;place-items:center;padding:20px}.modal-bg.open{display:grid}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px;padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#edf4ff;color:var(--blue);padding:9px 12px;border-radius:10px}
.table-wrap{overflow:auto}.orders{width:100%;border-collapse:collapse;min-width:750px}.orders th,.orders td{padding:13px;border-bottom:1px solid var(--line);text-align:right}.orders th{background:#f7faff}.order-status{padding:6px 9px;border-radius:50px;background:#edf4ff;color:var(--blue);font-size:12px;font-weight:900}
.message{display:none;padding:12px;border-radius:10px;margin-top:12px}.message.ok{display:block;background:#dcfce7;color:#166534}.message.err{display:block;background:#fee2e2;color:#991b1b}
@media(max-width:900px){.sidebar{width:75px;padding:15px 8px}.logo{font-size:0;text-align:center}.logo:first-letter{font-size:28px}.navbtn{font-size:0;text-align:center}.navbtn:first-letter{font-size:21px}.main{margin-right:75px}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.main{padding:15px}.topbar h1{font-size:24px}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.sidebar{width:62px}.main{margin-right:62px}}
</style>
</head>
<body>

<div id="login" class="login">
 <div class="login-card">
  <div class="brand">Dada <span>Best</span></div>
  <h2>כניסה לאדמין</h2>
  <p>ניהול מוצרים, מחירים, מלאי והזמנות.</p>
  <label>סיסמת מנהל</label>
  <input id="password" type="password" placeholder="הזן סיסמה">
  <button class="primary" style="width:100%;margin-top:16px" onclick="login()">כניסה למערכת</button>
  <div id="loginMsg" class="message"></div>
 </div>
</div>

<div id="app" class="app">
 <aside class="sidebar">
  <div class="logo">Dada <span>Best</span></div>
  <button class="navbtn active" onclick="showView('dashboard',this)">📊 דשבורד</button>
  <button class="navbtn" onclick="showView('productsView',this)">🛍️ מוצרים</button>
  <button class="navbtn" onclick="showView('ordersView',this)">📦 הזמנות</button>
  <button class="navbtn" onclick="logout()">🚪 יציאה</button>
 </aside>

 <main class="main">
  <div class="topbar"><h1 id="pageTitle">דשבורד</h1><span class="status">● המערכת מחוברת</span></div>

  <section id="dashboard" class="view active">
   <div class="stats">
    <div class="stat"><small>מוצרים</small><b id="statProducts">0</b></div>
    <div class="stat"><small>מוצרים במלאי</small><b id="statStock">0</b></div>
    <div class="stat"><small>הזמנות</small><b id="statOrders">0</b></div>
    <div class="stat"><small>מחזור הזמנות</small><b id="statRevenue">0 ₪</b></div>
   </div>
   <div class="panel"><div class="panel-head"><h2>מוצרים אחרונים</h2><button class="soft" onclick="showView('productsView')">ניהול מוצרים</button></div><div id="recentProducts" class="products"></div></div>
  </section>

  <section id="productsView" class="view">
   <div class="panel">
    <div class="panel-head"><h2>🛍️ ניהול מוצרים</h2><button class="primary" onclick="openProduct()">＋ הוסף מוצר</button></div>
    <div class="toolbar"><input id="search" placeholder="🔎 חיפוש מוצר..." oninput="renderProducts()"><button class="soft" onclick="loadAll()">↻ רענון</button></div>
    <br><div id="products" class="products"></div>
   </div>
  </section>

  <section id="ordersView" class="view">
   <div class="panel"><div class="panel-head"><h2>📦 הזמנות</h2><button class="soft" onclick="loadOrders()">↻ רענון</button></div><div class="table-wrap"><table class="orders"><thead><tr><th>מספר</th><th>לקוח</th><th>סכום</th><th>סוג קבלה</th><th>תאריך</th><th>פרטים</th></tr></thead><tbody id="orders"></tbody></table></div></div>
  </section>
 </main>
</div>

<div id="modalBg" class="modal-bg">
 <div class="modal">
  <div class="modal-head"><h2 id="modalTitle">הוספת מוצר</h2><button class="close" onclick="closeProduct()">✕</button></div>
  <form id="productForm">
   <div class="formgrid">
    <div><label>שם מוצר *</label><input id="pName" required></div>
    <div><label>מחיר ₪ *</label><input id="pPrice" type="number" min="0" step=".01" required></div>
    <div><label>מלאי</label><input id="pStock" type="number" min="0" value="0"></div>
    <div><label>קטגוריה</label><input id="pCategory" placeholder="לדוגמה: מצלמות"></div>
    <div class="full"><label>תיאור</label><textarea id="pDescription" rows="3"></textarea></div>
    <div class="full"><label>תמונת מוצר 📷</label><div class="upload"><input id="pImage" type="file" accept="image/*"><div id="preview" class="preview">📷</div></div></div>
   </div>
   <button class="primary" type="submit" style="margin-top:18px">💾 שמור מוצר</button><div id="formMsg" class="message"></div>
  </form>
 </div>
</div>

<script>
let products=[],orders=[],editing=null,imageData="";
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

async function login(){
 const password=$('password').value;
 if(!password)return msg('loginMsg','הזן סיסמה','err');
 try{
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.error||'סיסמת אדמין שגויה');
  sessionStorage.setItem('adminLogged','1');$('login').style.display='none';$('app').style.display='block';loadAll();
 }catch(e){msg('loginMsg',e.message,'err')}
}
function logout(){sessionStorage.removeItem('adminLogged');location.reload()}
if(sessionStorage.getItem('adminLogged')){$('login').style.display='none';$('app').style.display='block';loadAll()}

async function loadAll(){await loadProducts();await loadOrders();updateStats()}
async function loadProducts(){
 try{let r=await fetch('/api/products');if(!r.ok)throw Error();products=await r.json();renderProducts();renderRecent()}catch(e){$('products').innerHTML='<p>שגיאה בטעינת מוצרים.</p>'}
}
async function loadOrders(){
 try{let r=await fetch('/api/orders');if(!r.ok)throw Error();orders=await r.json();renderOrders()}catch(e){orders=[];$('orders').innerHTML='<tr><td colspan="6">לא ניתן לטעון הזמנות.</td></tr>'}
}
function updateStats(){
 $('statProducts').textContent=products.length;
 $('statStock').textContent=products.reduce((s,p)=>s+Number(p.stock||0),0);
 $('statOrders').textContent=orders.length;
 $('statRevenue').textContent=orders.reduce((s,o)=>s+Number(o.total||0),0).toFixed(2)+' ₪';
}
function card(p){
 const image=String(p.image||'');const visual=(image.startsWith('http')||image.startsWith('data:'))?'<img src="'+esc(image)+'" alt="">':'📷';
 return '<article class="product"><span class="badge '+(Number(p.stock||0)>0?'':'off')+'">'+(Number(p.stock||0)>0?'פעיל':'אזל')+'</span><div class="pic">'+(visual.includes('<img')?visual:visual)+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+Number(p.price||0).toFixed(2)+' ₪</div><div class="meta">📦 מלאי: '+Number(p.stock||0)+'</div><div class="meta">'+esc(p.category||'ללא קטגוריה')+'</div><div class="actions"><button class="soft" onclick="editProduct('+Number(p.id)+')">✏️ ערוך</button><button class="danger" onclick="deleteProduct('+Number(p.id)+')">🗑️ מחק</button></div></article>';
}
function renderProducts(){
 const q=($('search').value||'').toLowerCase();const list=products.filter(p=>String(p.name).toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q));
 $('products').innerHTML=list.length?list.map(card).join(''):'<p>לא נמצאו מוצרים.</p>'
}
function renderRecent(){$('recentProducts').innerHTML=products.slice(0,4).map(card).join('')||'<p>אין מוצרים.</p>'}
function renderOrders(){
 $('orders').innerHTML=orders.length?orders.map(o=>'<tr><td><b>'+esc(o.order_number||o.id||'-')+'</b></td><td>'+esc(o.customer?.name||o.name||'-')+'<br>'+esc(o.customer?.phone||o.phone||'')+'</td><td><b>'+Number(o.total||0).toFixed(2)+' ₪</b></td><td><span class="order-status">'+esc(o.customer?.shipping||o.shipping||'-')+'</span></td><td>'+esc(o.created_at||o.createdAt||'-')+'</td><td><button class="soft" onclick="viewOrder('+JSON.stringify(o).replace(/"/g,'&quot;')+')">צפייה</button></td></tr>').join(''):'<tr><td colspan="6">אין הזמנות.</td></tr>'
}
function showView(id,btn){
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');
 document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');
 $('pageTitle').textContent=id==='dashboard'?'דשבורד':id==='productsView'?'מוצרים':'הזמנות'
}
function openProduct(p=null){
 editing=p?p.id:null;imageData=p?.image||'';$('modalTitle').textContent=p?'עריכת מוצר':'הוספת מוצר';
 $('pName').value=p?.name||'';$('pPrice').value=p?.price??'';$('pStock').value=p?.stock??0;$('pCategory').value=p?.category||'';$('pDescription').value=p?.description||'';
 $('preview').innerHTML=imageData?'<img src="'+esc(imageData)+'">':'📷';$('pImage').value='';$('modalBg').classList.add('open')
}
function closeProduct(){$('modalBg').classList.remove('open');editing=null;imageData='';$('productForm').reset();$('preview').textContent='📷'}
function editProduct(id){const p=products.find(x=>Number(x.id)===Number(id));if(p)openProduct(p)}
$('pImage').addEventListener('change',()=>{
 const f=$('pImage').files[0];if(!f)return;if(f.size>5*1024*1024)return msg('formMsg','תמונה עד 5MB בלבד','err');
 const r=new FileReader();r.onload=e=>{imageData=e.target.result;$('preview').innerHTML='<img src="'+imageData+'">'};r.readAsDataURL(f)
})
$('productForm').addEventListener('submit',async e=>{
 e.preventDefault();const body={name:$('pName').value.trim(),price:Number($('pPrice').value),stock:Number($('pStock').value||0),category:$('pCategory').value.trim(),description:$('pDescription').value.trim(),image:imageData};
 try{const r=await fetch(editing?'/api/products/'+editing:'/api/products',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'שגיאה בשמירה');closeProduct();await loadAll()}catch(e){msg('formMsg',e.message,'err')}
})
async function deleteProduct(id){if(!confirm('למחוק את המוצר?'))return;const r=await fetch('/api/products/'+id,{method:'DELETE'});if(r.ok)loadAll();else alert('לא ניתן למחוק את המוצר')}
function viewOrder(o){const c=o.customer||o;alert('הזמנה '+(o.order_number||o.id||'')+'\\n\\nלקוח: '+(c.name||'-')+'\\nטלפון: '+(c.phone||'-')+'\\nקבלה: '+(c.shipping||'-')+'\\nכתובת: '+[c.city,c.street,c.house,c.apartment].filter(Boolean).join(', ')+'\\n\\nמוצרים:\\n'+(o.items||[]).map(x=>x.name+' × '+x.quantity).join('\\n')+'\\n\\nסה״כ: '+Number(o.total||0).toFixed(2)+' ₪')}
function msg(id,text,type){$(id).className='message '+type;$(id).textContent=text}
</script>
</body>
</html>
