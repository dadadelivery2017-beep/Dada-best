```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dada Best - אדמין</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    button, input, textarea, select {
      font: inherit;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header-inner {
      max-width: 1300px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .container {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
      text-align: center;
    }

    .login-box input {
      width: 100%;
      margin: 10px 0;
    }

    /* BUTTONS */

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    /* NAV */

    .nav {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav button.active {
      background: #111827;
      color: white;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .stat-title {
      color: #6b7280;
      font-size: 14px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    /* TOOLBAR */

    .toolbar {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, textarea, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
    }

    /* PRODUCTS */

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .product-image {
      height: 150px;
      background: #f9fafb;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #16a34a;
    }

    .stock {
      margin: 8px 0;
      color: #6b7280;
    }

    .inactive {
      opacity: .55;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    /* ORDERS */

    .orders {
      display: grid;
      gap: 15px;
    }

    .order {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 15px;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .box {
      background: #f9fafb;
      padding: 15px;
      border-radius: 10px;
    }

    .item {
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
    }

    .empty {
      background: white;
      padding: 40px;
      border-radius: 14px;
      text-align: center;
      color: #6b7280;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
    }

    .success-message {
      color: #16a34a;
      margin-top: 10px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .products,
      .stats,
      .order-grid {
        grid-template-columns: 1fr;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-box">

    <h1>🔐 Dada Best</h1>

    <p>כניסה למערכת הניהול</p>

    <input
      id="adminPassword"
      type="password"
      placeholder="סיסמת אדמין"
      onkeydown="if(event.key==='Enter') login()"
    >

    <button class="primary" style="width:100%" onclick="login()">
      כניסה
    </button>

    <div id="loginError" class="error"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminScreen" class="hidden">

  <header>

    <div class="header-inner">

      <div>
        <h1>Dada Best — מערכת ניהול</h1>
        <div>ניהול מוצרים והזמנות</div>
      </div>

      <button class="secondary" onclick="logout()">
        יציאה
      </button>

    </div>

  </header>


  <main class="container">

    <div class="nav">

      <button
        id="productsTab"
        class="active"
        onclick="showSection('products')">
        📦 מוצרים
      </button>

      <button
        id="ordersTab"
        onclick="showSection('orders')">
        🛒 הזמנות
      </button>

      <button
        class="success"
        onclick="openProductModal()">
        ➕ מוצר חדש
      </button>

    </div>


    <!-- PRODUCTS -->

    <section id="productsSection">

      <div class="stats">

        <div class="stat">
          <div class="stat-title">סה״כ מוצרים</div>
          <div class="stat-number" id="productsCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">מוצרים פעילים</div>
          <div class="stat-number" id="activeProducts">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">מוצרים ללא מלאי</div>
          <div class="stat-number" id="outOfStock">0</div>
        </div>

        <div class="stat">
          <div class="stat-title">מחיר ממוצע</div>
          <div class="stat-number" id="averagePrice">0 ₪</div>
        </div>

      </div>


      <div class="toolbar">

        <input
          id="productSearch"
          placeholder="חיפוש מוצר..."
          oninput="renderProducts()"
        >

        <button class="secondary" onclick="loadProducts()">
          ↻ רענון
        </button>

      </div>


      <div id="products" class="products"></div>

    </section>


    <!-- ORDERS -->

    <section id="ordersSection" class="hidden">

      <div class="toolbar">

        <input
          id="orderSearch"
          placeholder="חיפוש לפי שם, טלפון או מספר הזמנה..."
          oninput="renderOrders()"
        >

        <select id="statusFilter" onchange="renderOrders()">
          <option value="">כל הסטטוסים</option>
          <option value="חדשה">חדשה</option>
          <option value="בטיפול">בטיפול</option>
          <option value="נשלחה">נשלחה</option>
          <option value="הושלמה">הושלמה</option>
        </select>

        <button class="secondary" onclick="loadOrders()">
          ↻ רענון
        </button>

      </div>

      <div id="orders" class="orders"></div>

    </section>

  </main>

</div>


<!-- PRODUCT MODAL -->

<div id="productModal" class="modal hidden">

  <div class="modal-box">

    <h2 id="modalTitle">מוצר חדש</h2>

    <input type="hidden" id="productId">

    <div class="form-group">

      <label>שם המוצר</label>

      <input id="productName" placeholder="לדוגמה: מצלמת WiFi">

    </div>


    <div class="form-group">

      <label>תיאור</label>

      <textarea
        id="productDescription"
        rows="4"
        placeholder="תיאור המוצר">
      </textarea>

    </div>


    <div class="form-group">

      <label>מחיר ₪</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
      >

    </div>


    <div class="form-group">

      <label>מלאי</label>

      <input
        id="productStock"
        type="number"
        min="0"
        step="1"
      >

    </div>


    <div class="form-group">

      <label>קישור לתמונה</label>

      <input
        id="productImage"
        placeholder="https://..."
      >

    </div>


    <div class="form-group">

      <label>
        <input
          id="productActive"
          type="checkbox"
          checked
          style="width:auto"
        >
        מוצר פעיל בחנות
      </label>

    </div>


    <div id="modalMessage"></div>


    <div class="modal-actions">

      <button class="success" onclick="saveProduct()">
        💾 שמור
      </button>

      <button class="secondary" onclick="closeProductModal()">
        ביטול
      </button>

    </div>

  </div>

</div>


<script>

  let adminKey = sessionStorage.getItem("dada_admin_key") || "";

  let products = [];
  let orders = [];


  /* =========================
     AUTH
  ========================= */

  async function login() {

    const password =
      document.getElementById("adminPassword").value.trim();

    if (!password) {
      document.getElementById("loginError").textContent =
        "יש להזין סיסמה";
      return;
    }

    adminKey = password;

    sessionStorage.setItem(
      "dada_admin_key",
      adminKey
    );

    try {

      const response = await fetch(
        "/api/admin/products",
        {
          headers: {
            "x-admin-key": adminKey
          }
        }
      );

      if (!response.ok) {
        throw new Error("סיסמה שגויה");
      }

      document.getElementById("loginScreen")
        .classList.add("hidden");

      document.getElementById("adminScreen")
        .classList.remove("hidden");

      products = await response.json();

      updateProductStats();
      renderProducts();

      loadOrders();

    } catch (error) {

      sessionStorage.removeItem("dada_admin_key");

      document.getElementById("loginError").textContent =
        "סיסמת אדמין שגויה או שהשרת לא זמין";

    }

  }


  function logout() {

    sessionStorage.removeItem("dada_admin_key");

    adminKey = "";

    location.reload();

  }


  async function api(url, options = {}) {

    options.headers = {
      ...(options.headers || {}),
      "x-admin-key": adminKey,
      "Content-Type": "application/json"
    };

    const response =
      await fetch(url, options);

    if (response.status === 401) {
      logout();
      throw new Error("Unauthorized");
    }

    if (!response.ok) {

      let data = {};

      try {
        data = await response.json();
      } catch {}

      throw new Error(
        data.error || "שגיאה בבקשה"
      );

    }

    return response.json();

  }


  /* =========================
     SECTIONS
  ========================= */

  function showSection(section) {

    const productsSection =
      document.getElementById("productsSection");

    const ordersSection =
      document.getElementById("ordersSection");

    const productsTab =
      document.getElementById("productsTab");

    const ordersTab =
      document.getElementById("ordersTab");


    if (section === "products") {

      productsSection.classList.remove("hidden");
      ordersSection.classList.add("hidden");

      productsTab.classList.add("active");
      ordersTab.classList.remove("active");

    } else {

      productsSection.classList.add("hidden");
      ordersSection.classList.remove("hidden");

      productsTab.classList.remove("active");
      ordersTab.classList.add("active");

      loadOrders();

    }

  }


  /* =========================
     PRODUCTS
  ========================= */

  async function loadProducts() {

    try {

      products =
        await api("/api/admin/products");

      updateProductStats();
      renderProducts();

    } catch (error) {

      alert(error.message);

    }

  }


  function updateProductStats() {

    document.getElementById("productsCount")
      .textContent = products.length;

    document.getElementById("activeProducts")
      .textContent =
      products.filter(p => p.active).length;

    document.getElementById("outOfStock")
      .textContent =
      products.filter(p => Number(p.stock) === 0).length;

    const average =
      products.length
        ? products.reduce(
            (sum, p) => sum + Number(p.price || 0),
            0
          ) / products.length
        : 0;

    document.getElementById("averagePrice")
      .textContent =
      average.toFixed(2) + " ₪";

  }


  function renderProducts() {

    const container =
      document.getElementById("products");

    const search =
      document.getElementById("productSearch")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(product => {

        return (
          !search ||
          String(product.name || "")
            .toLowerCase()
            .includes(search) ||
          String(product.description || "")
            .toLowerCase()
            .includes(search)
        );

      });


    if (!filtered.length) {

      container.innerHTML =
        '<div class="empty">אין מוצרים להצגה</div>';

      return;

    }


    container.innerHTML =
      filtered.map(product => {

        const image =
          product.image || "📦";

        const imageHtml =
          image.startsWith("http")
            ? `<img src="${escapeHtml(image)}" alt="">`
            : `<span>${escapeHtml(image)}</span>`;


        return `

          <div class="product ${product.active ? "" : "inactive"}">

            <div class="product-image">
              ${imageHtml}
            </div>

            <h3>${escapeHtml(product.name)}</h3>

            <p>
              ${escapeHtml(product.description || "")}
            </p>

            <div class="price">
              ${Number(product.price).toFixed(2)} ₪
            </div>

            <div class="stock">
              מלאי: ${Number(product.stock)}
            </div>

            <div>
              ${product.active
                ? "🟢 פעיל"
                : "🔴 מוסתר מהחנות"}
            </div>

            <div class="actions">

              <button
                class="primary"
                onclick="editProduct(${product.id})">
                ✏️ עריכה
              </button>

              <button
                class="secondary"
                onclick="toggleProduct(${product.id})">
                ${product.active
                  ? "👁️ הסתר"
                  : "👁️ הצג"}
              </button>

              <button
                class="danger"
                onclick="deleteProduct(${product.id})">
                🗑️ מחיקה
              </button>

            </div>

          </div>

        `;

      }).join("");

  }


  function openProductModal(product = null) {

    document.getElementById("productModal")
      .classList.remove("hidden");

    document.getElementById("modalMessage")
      .textContent = "";


    if (product) {

      document.getElementById("modalTitle")
        .textContent = "עריכת מוצר";

      document.getElementById("productId")
        .value = product.id;

      document.getElementById("productName")
        .value = product.name || "";

      document.getElementById("productDescription")
        .value = product.description || "";

      document.getElementById("productPrice")
        .value = product.price || 0;

      document.getElementById("productStock")
        .value = product.stock || 0;

      document.getElementById("productImage")
        .value = product.image || "";

      document.getElementById("productActive")
        .checked = product.active;

    } else {

      document.getElementById("modalTitle")
        .textContent = "מוצר חדש";

      document.getElementById("productId")
        .value = "";

      document.getElementById("productName")
        .value = "";

      document.getElementById("productDescription")
        .value = "";

      document.getElementById("productPrice")
        .value = 0;

      document.getElementById("productStock")
        .value = 0;

      document.getElementById("productImage")
        .value = "";

      document.getElementById("productActive")
        .checked = true;

    }

  }


  function closeProductModal() {

    document.getElementById("productModal")
      .classList.add("hidden");

  }


  function editProduct(id) {

    const product =
      products.find(p => p.id === id);

    if (product) {
      openProductModal(product);
    }

  }


  async function saveProduct() {

    const id =
      document.getElementById("productId").value;

    const data = {

      name:
        document.getElementById("productName")
          .value
          .trim(),

      description:
        document.getElementById("productDescription")
          .value
          .trim(),

      price:
        Number(
          document.getElementById("productPrice").value
        ),

      stock:
        Number(
          document.getElementById("productStock").value
        ),

      image:
        document.getElementById("productImage")
          .value
          .trim(),

      active:
        document.getElementById("productActive")
          .checked

    };


    if (!data.name) {

      document.getElementById("modalMessage")
        .textContent = "יש להזין שם מוצר";

      return;

    }


    try {

      if (id) {

        await api(
          "/api/admin/products/" + id,
          {
            method: "PATCH",
            body: JSON.stringify(data)
          }
        );

      } else {

        await api(
          "/api/admin/products",
          {
            method: "POST",
            body: JSON.stringify(data)
          }
        );

      }


      closeProductModal();

      await loadProducts();

      alert(
        id
          ? "המוצר עודכן בהצלחה ✅"
          : "המוצר נוסף בהצלחה ✅"
      );

    } catch (error) {

      document.getElementById("modalMessage")
        .textContent = error.message;

    }

  }


  async function toggleProduct(id) {

    const product =
      products.find(p => p.id === id);

    if (!product) return;


    try {

      await api(
        "/api/admin/products/" + id,
        {
          method: "PATCH",
          body: JSON.stringify({
            name: product.name,
            description: product.description,
            price: product.price,
            stock: product.stock,
            image: product.image,
            active: !product.active
          })
        }
      );

      await loadProducts();

    } catch (error) {

      alert(error.message);

    }

  }


  async function deleteProduct(id) {

    const product =
      products.find(p => p.id === id);

    if (!product) return;


    const confirmed =
      confirm(
        `למחוק את "${product.name}"?`
      );

    if (!confirmed) return;


    try {

      await api(
        "/api/admin/products/" + id,
        {
          method: "DELETE"
        }
      );

      await loadProducts();

    } catch (error) {

      alert(error.message);

    }

  }


  /* =========================
     ORDERS
  ========================= */

  async function loadOrders() {

    try {

      orders =
        await api("/api/orders");

      renderOrders();

    } catch (error) {

      document.getElementById("orders")
        .innerHTML =
        `<div class="empty">
          ${escapeHtml(error.message)}
        </div>`;

    }

  }


  function renderOrders() {

    const container =
      document.getElementById("orders");

    const search =
      document.getElementById("orderSearch")
        .value
        .toLowerCase()
        .trim();

    const status =
      document.getElementById("statusFilter")
        .value;


    const filtered =
      orders.filter(order => {

        const text =
          [
            order.order_number,
            order.customer_name,
            order.phone
          ]
          .join(" ")
          .toLowerCase();


        return (
          (!search || text.includes(search)) &&
          (!status || order.status === status)
        );

      });


    if (!filtered.length) {

      container.innerHTML =
        '<div class="empty">אין הזמנות להצגה</div>';

      return;

    }


    container.innerHTML =
      filtered.map(order => {

        let items = [];

        try {
          items =
            typeof order.items === "string"
              ? JSON.parse(order.items)
              : order.items || [];
        } catch {}


        const itemsHtml =
          items.map(item => `

            <div class="item">

              <span>
                ${escapeHtml(
                  item.name || item.title || "מוצר"
                )}
                × ${Number(item.quantity || 1)}
              </span>

              <strong>
                ${Number(item.price || 0).toFixed(2)} ₪
              </strong>

            </div>

          `).join("");


        return `

          <div class="order">

            <div class="order-top">

              <div>

                <h2>
                  ${escapeHtml(order.order_number)}
                </h2>

                <small>
                  ${formatDate(order.created_at)}
                </small>

              </div>

              <select
                onchange="changeOrderStatus(${order.id}, this.value)">

                ${["חדשה","בטיפול","נשלחה","הושלמה"]
                  .map(status => `
                    <option
                      value="${status}"
                      ${order.status === status ? "selected" : ""}>
                      ${status}
                    </option>
                  `).join("")}

              </select>

            </div>


            <div class="order-grid">

              <div class="box">

                <h3>👤 לקוח</h3>

                <p>
                  <strong>שם:</strong>
                  ${escapeHtml(order.customer_name)}
                </p>

                <p>
                  <strong>טלפון:</strong>

  async function changeOrderStatus(id, status) {

    try {

      await api(
        "/api/orders/" + id,
        {
          method: "PATCH",
          body: JSON.stringify({ status })
        }
      );

      await loadOrders();

    } catch (error) {

      alert(error.message);

    }

  }


  async function deleteOrder(id) {

    if (!confirm("למחוק את ההזמנה?")) {
      return;
    }


    try {

      await api(
        "/api/orders/" + id,
        {
          method: "DELETE"
        }
      );

      await loadOrders();

    } catch (error) {

      alert(error.message);

    }

  }

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatDate(value) {

    if (!value) return "";

    try {

      return new Date(value)
        .toLocaleString("he-IL");

    } catch {

      return value;

    }

  }
