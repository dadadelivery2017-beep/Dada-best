<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dada Best | ניהול מוצרים</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:#f4f8ff;color:#07152f}
header{background:linear-gradient(110deg,#063b9f,#1264ff,#35c8ff);color:#fff;padding:24px}
header h1{margin:0;font-size:30px}header p{margin:7px 0 0;color:#e8f6ff}
main{max-width:1100px;margin:30px auto;padding:0 18px}
.card{background:#fff;border:1px solid #e1eaf6;border-radius:22px;padding:24px;margin-bottom:22px;box-shadow:0 15px 40px #0b24500b}
h2{margin-top:0}label{display:block;font-weight:800;margin:12px 0 6px}
input,textarea{width:100%;padding:13px;border:1px solid #cbd8e9;border-radius:10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full{grid-column:1/-1}
.upload{border:2px dashed #b8cbea;border-radius:16px;padding:20px;text-align:center;background:#f8fbff}
.preview{width:180px;height:150px;margin:15px auto 0;border-radius:14px;background:#edf4ff;display:grid;place-items:center;overflow:hidden;font-size:50px}
.preview img{width:100%;height:100%;object-fit:cover}
button{border:0;border-radius:11px;padding:13px 18px;cursor:pointer;font-weight:900;font-size:15px}
.primary{background:linear-gradient(100deg,#063b9f,#1264ff);color:#fff}
.secondary{background:#eaf2ff;color:#1264ff}
.danger{background:#fee2e2;color:#b42318}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.product{border:1px solid #e1eaf6;border-radius:18px;padding:12px;background:#fff}
.product img,.noimg{width:100%;height:180px;object-fit:cover;border-radius:13px;background:#edf4ff;display:grid;place-items:center;font-size:50px}
.product h3{margin:12px 5px 5px}.price{font-size:21px;font-weight:900;margin:8px 5px}
.actions{display:flex;gap:8px}.actions button{flex:1}
.message{display:none;padding:13px;border-radius:10px;margin-top:15px}.ok{display:block;background:#dcfce7;color:#166534}.err{display:block;background:#fee2e2;color:#991b1b}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>⚙️ Dada Best — ניהול החנות</h1><p>הוספה, עריכה ומחיקת מוצרים כולל תמונות</p></header>

<main>
<div class="card">
<h2 id="formTitle">➕ הוספת מוצר חדש</h2>
<form id="productForm">
<div class="grid">
<div><label>שם המוצר *</label><input id="name" required></div>
<div><label>מחיר ₪ *</label><input id="price" type="number" min="0" step="0.01" required></div>
<div><label>מלאי</label><input id="stock" type="number" min="0" value="0"></div>
<div><label>קטגוריה</label><input id="category" placeholder="לדוגמה: מצלמות"></div>
<div class="full"><label>תיאור</label><textarea id="description" rows="3"></textarea></div>
<div class="full">
<label>תמונת מוצר 📷</label>
<div class="upload">
<input id="imageFile" type="file" accept="image/*">
<div id="preview" class="preview">📷</div>
<p style="color:#64748b;margin-bottom:0">בחר תמונה מהמחשב. התמונה תישמר במערכת ותוצג באתר.</p>
</div>
</div>
</div>
<br>
<button class="primary" type="submit" id="saveBtn">שמור מוצר</button>
<button class="secondary" type="button" onclick="resetForm()">נקה</button>
<div id="message" class="message"></div>
</form>
</div>

<div class="card">
<h2>🛍️ המוצרים בחנות</h2>
<div id="products" class="products"><p>טוען...</p></div>
</div>
</main>

<script>
let products=[],editingId=null,imageData="";
const $=id=>document.getElementById(id);

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

$('imageFile').addEventListener('change',()=>{
 const file=$('imageFile').files[0];if(!file)return;
 if(file.size>5*1024*1024){show('התמונה גדולה מדי. בחר תמונה עד 5MB.','err');$('imageFile').value='';return}
 const reader=new FileReader();
 reader.onload=e=>{imageData=e.target.result;$('preview').innerHTML='<img src="'+imageData+'">'}
 reader.readAsDataURL(file);
});

async function load(){
 try{
  const r=await fetch('/api/products');if(!r.ok)throw Error();
  products=await r.json();render();
 }catch(e){$('products').innerHTML='<p>לא ניתן לטעון מוצרים. בדוק שהשרת עובד.</p>'}
}

function render(){
 if(!products.length){$('products').innerHTML='<p>אין מוצרים.</p>';return}
 $('products').innerHTML=products.map(p=>{
  const visual=String(p.image||'').startsWith('http')||String(p.image||'').startsWith('data:')
   ?'<img src="'+esc(p.image)+'">'
   :'<div class="noimg">🛍️</div>';
  return '<div class="product">'+visual+
   '<h3>'+esc(p.name)+'</h3><div class="price">'+Number(p.price).toFixed(2)+' ₪</div>'+
   '<div>מלאי: '+Number(p.stock||0)+'</div><br>'+
   '<div class="actions"><button class="secondary" onclick="edit('+Number(p.id)+')">✏️ עריכה</button>'+
   '<button class="danger" onclick="removeProduct('+Number(p.id)+')">🗑️ מחיקה</button></div></div>'
 }).join('');
}

function edit(id){
 const p=products.find(x=>Number(x.id)===id);if(!p)return;
 editingId=id;$('formTitle').textContent='✏️ עריכת מוצר';
 $('name').value=p.name||'';$('price').value=p.price||0;$('stock').value=p.stock||0;
 $('category').value=p.category||'';$('description').value=p.description||'';
 imageData=p.image||'';$('preview').innerHTML=imageData?'<img src="'+esc(imageData)+'">':'📷';
 $('saveBtn').textContent='עדכן מוצר';window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
 editingId=null;imageData='';$('productForm').reset();$('stock').value=0;
 $('preview').textContent='📷';$('formTitle').textContent='➕ הוספת מוצר חדש';$('saveBtn').textContent='שמור מוצר';
}

$('productForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const payload={
  name:$('name').value.trim(),price:Number($('price').value),stock:Number($('stock').value||0),
  category:$('category').value.trim(),description:$('description').value.trim(),image:imageData
 };
 try{
  const url=editingId?'/api/products/'+editingId:'/api/products';
  const r=await fetch(url,{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(data.error||'שגיאה בשמירת המוצר');
  show(editingId?'המוצר עודכן בהצלחה!':'המוצר נוסף בהצלחה!','ok');
  resetForm();await load();
 }catch(err){show(err.message,'err')}
});

async function removeProduct(id){
 if(!confirm('למחוק את המוצר?'))return;
 try{
  const r=await fetch('/api/products/'+id,{method:'DELETE'});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(data.error||'שגיאה במחיקה');
  await load();show('המוצר נמחק.','ok');
 }catch(e){show(e.message,'err')}
}

function show(text,type){$('message').className='message '+type;$('message').textContent=text}
load();
</script>
</body>
</html>
